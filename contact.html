<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashmit Maharban | Contact</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <div class="logo">
                <img src="img/ai-robot-logo.png" alt="Ashmit Maharban Logo" class="logo-image">
                <span>Ashmit</span> Maharban
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Over Mij</a></li>
                <li><a href="work.html">Werk</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <button id="themeToggle" class="theme-toggle">🌙</button>
                <button class="hamburger">☰</button>
            </div>
        </nav>
    </header>
    <main class="section">
        <div class="container">
            <div class="section-title">
                <span>CONTACT</span>
                <h2>Neem contact op</h2>
            </div>
            <form id="contactForm" class="contact-form">
                <input type="text" name="name" placeholder="Naam" required>
                <input type="email" name="email" placeholder="E-mailadres" required>
                <textarea name="message" placeholder="Uw bericht..." required></textarea>
                <button type="submit" class="btn btn-primary">Versturen</button>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 Ashmit Maharban</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/form-validation.js"></script>
</body>
</html>
