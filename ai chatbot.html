<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="css/chatbot toggle.css">
</head>
<body>

    <!-- =========================
         AI CHATBOT BUTTON
    ========================= -->

    <div class="chatbot-toggle" id="chatbotToggle" aria-label="Open AI chatbot">

        <img
            src="img/ai-robot-logo.png"
            alt="AI Assistant">

    </div>

    <!-- =========================
         CHATBOT CONTAINER
    ========================= -->

    <div class="chatbot-container" id="chatbotContainer" aria-hidden="true">

        <!-- HEADER -->

        <div class="chatbot-header">

            <div class="chatbot-header-info">

                <img
                    src="img/ai-robot-logo.png"
                    alt="AI Assistant">

                <div>

                    <h3>AI Assistant</h3>

                    <span>Online</span>

                </div>

            </div>

            <button id="closeChatbot" aria-label="Close chatbot">
                ✕
            </button>

        </div>

        <!-- BODY -->

        <div class="chatbot-body" id="chatbotBody">

            <div class="bot-message">

                👋 Hoi! Ik ben Ashmit's AI Assistent.
                Vraag mij iets over zijn ervaring,
                projecten, SOC Engineering,
                recruitment of technische achtergrond.

            </div>

        </div>

        <!-- INPUT -->

        <div class="chatbot-footer">

            <input
                type="text"
                id="chatbotInput"
                placeholder="Stel een vraag..."
                aria-label="Chatbot input">

            <button id="sendMessage" aria-label="Send message">

                ➤

            </button>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.12.313/pdf.min.js"></script>
    <script src="js/chatbot elements.js" defer></script>
</body>
</html>
